name: Build Protected APK (No Signing)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Clone XopProtector
        run: |
          git clone --depth 1 https://github.com/xopJack/XopProtector.git
          cd XopProtector
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      - name: Patch XopProtector settings.gradle.kts (Remove Windows hardcoded path)
        run: |
          # لائن حذف کریں جس میں SDK-Android@5.14 موجود ہو
          sed -i '/SDK-Android@5.14/d' XopProtector/settings.gradle.kts
          echo "✔ Patched settings.gradle.kts — Windows path removed"

      - name: Verify Patch (Optional)
        run: |
          echo "Checking for any remaining hardcoded paths:"
          grep -n "SDK-Android" XopProtector/settings.gradle.kts || echo "✔ No hardcoded SDK path found"

      - name: Build XopProtector Packer & Shell Files
        run: |
          cd XopProtector
          chmod +x gradlew
          ./gradlew :packer:jar exportShellFiles --no-daemon --stacktrace
          echo "PACKER_JAR=$(find packer/build/libs -name 'protector-packer-*.jar' | head -1)" >> $GITHUB_ENV
          echo "SHELL_DIR=$(pwd)/executable/shell-files" >> $GITHUB_ENV

      - name: Build Release APK (R8 obfuscated)
        run: |
          gradle assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

      - name: Locate Release APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✔ Found APK: $APK_PATH"

      - name: Protect APK with XopProtector (DEX encryption)
        run: |
          java -jar "$PACKER_JAR" \
            "$APK_PATH" \
            -o app-protected.apk \
            --shell-dir "$SHELL_DIR" \
            --profile balanced
          echo "✔ Protected APK created: app-protected.apk"

      - name: Upload Protected APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealEarnPayPal-Protected-${{ github.run_number }}
          path: app-protected.apk
          retention-days: 30

      - name: Upload mapping.txt (for crash deobfuscation)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
