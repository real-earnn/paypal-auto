name: Build Protected & Signed APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install NDK 25.1.8937393 & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Verify Keystore
        run: |
          if [ ! -f silent_production.keystore ]; then
            echo "::error::silent_production.keystore not found in repository root"
            exit 1
          fi
          echo "✔ Keystore found ($(stat -c%s silent_production.keystore) bytes)"

      - name: Extract Signing SHA256
        run: |
          HASH=$(keytool -list -v \
            -keystore silent_production.keystore \
            -alias silentkey \
            -storepass silent123password \
            | grep "SHA256:" | awk '{print $2}' | head -1)
          if [ -z "$HASH" ]; then
            echo "::error::Failed to extract SHA256 from keystore"
            exit 1
          fi
          echo "SIGNING_SHA256=$HASH" >> $GITHUB_ENV
          echo "✔ Signing SHA256: $HASH"

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

      - name: Locate APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✔ Found APK: $APK_PATH"

      - name: Sign APK (v1 + v2 + v3)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -1)
          echo "Using apksigner: $APKSIGNER"

          $APKSIGNER sign \
            --ks silent_production.keystore \
            --ks-key-alias silentkey \
            --ks-pass pass:silent123password \
            --key-pass pass:silent123password \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app-signed.apk \
            "$APK_PATH"

          mv app-signed.apk "$APK_PATH"
          echo "✔ APK signed with persistent keystore"

      - name: Verify Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -1)
          $APKSIGNER verify --verbose --print-certs "$APK_PATH" | grep -i "SHA-256"
          echo "✔ Signature verified"

      - name: Clone XopProtector
        run: |
          git clone --depth 1 https://github.com/xopJack/XopProtector.git
          cd XopProtector
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties

      - name: Patch XopProtector settings
        run: |
          cat > XopProtector/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "XopProtector"
          include(":native")
          include(":packer")
          EOF
          echo "✔ settings.gradle.kts patched"

      - name: Build XopProtector
        run: |
          cd XopProtector
          chmod +x gradlew
          ./gradlew :packer:jar exportShellFiles --no-daemon --stacktrace

          PACKER_JAR_ABS=$(find "$(pwd)/packer/build/libs" -name 'protector-packer-*.jar' | head -1)
          if [ -z "$PACKER_JAR_ABS" ]; then
            echo "::error::Packer JAR not found"
            exit 1
          fi

          echo "PACKER_JAR=$PACKER_JAR_ABS" >> $GITHUB_ENV
          echo "SHELL_DIR=$(pwd)/executable/shell-files" >> $GITHUB_ENV
          echo "✔ PACKER_JAR=$PACKER_JAR_ABS"
          echo "✔ SHELL_DIR=$(pwd)/executable/shell-files"

      - name: Protect APK with XopProtector
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  PROTECTING APK WITH XOPPROTECTOR"
          echo "  Keystore SHA256: $SIGNING_SHA256"
          echo "════════════════════════════════════════════════════════════"

          OUTPUT_APK="$(pwd)/app-protected.apk"

          java -jar "$PACKER_JAR" \
            "$APK_PATH" \
            -o "$OUTPUT_APK" \
            --shell-dir "$SHELL_DIR" \
            --profile balanced

          if [ ! -f "$OUTPUT_APK" ]; then
            echo "::error::XopProtector failed to produce output"
            exit 1
          fi
          echo "✔ Protected APK created: $OUTPUT_APK ($(stat -c%s "$OUTPUT_APK") bytes)"

      - name: Re-sign Protected APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -1)
          OUTPUT_APK="$(pwd)/app-protected.apk"

          $APKSIGNER sign \
            --ks silent_production.keystore \
            --ks-key-alias silentkey \
            --ks-pass pass:silent123password \
            --key-pass pass:silent123password \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app-protected-signed.apk \
            "$OUTPUT_APK"

          if [ ! -f app-protected-signed.apk ]; then
            echo "::error::Re-signing failed"
            exit 1
          fi
          echo "✔ Protected APK re-signed"

      - name: Verify Final Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -1)

          echo "════════════════════════════════════════════════════════════"
          echo "  VERIFYING FINAL SIGNATURE"
          echo "════════════════════════════════════════════════════════════"

          # 🟢 Normalize: remove colons + lowercase both sides
          EXPECTED_NORM=$(echo "$SIGNING_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          FINAL_RAW=$($APKSIGNER verify --print-certs app-protected-signed.apk \
            | grep "SHA-256" | awk -F': ' '{print $2}' | head -1)
          FINAL_NORM=$(echo "$FINAL_RAW" | tr -d ':' | tr 'A-Z' 'a-z')

          echo "Expected (normalized): $EXPECTED_NORM"
          echo "Final    (normalized): $FINAL_NORM"

          if [ "$FINAL_NORM" = "$EXPECTED_NORM" ]; then
            echo "════════════════════════════════════════════════════════════"
            echo "  ✔✔✔ SIGNATURE MATCH — SAFE FOR USER UPDATES ✔✔✔"
            echo "  Users can install this update over the previous version"
            echo "  without losing data."
            echo "════════════════════════════════════════════════════════════"
          else
            echo "════════════════════════════════════════════════════════════"
            echo "  ⚠ WARNING: Signature mismatch!"
            echo "  Users will need to uninstall the previous version first,"
            echo "  which means DATA LOSS."
            echo "════════════════════════════════════════════════════════════"
            exit 1
          fi

      - name: Upload Final APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealEarnPayPal-Signed-${{ github.run_number }}
          path: app-protected-signed.apk
          retention-days: 30

      - name: Upload mapping.txt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
